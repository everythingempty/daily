const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const text = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));
const STORE = "virtuals-daily-key";

async function keyFor(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(D.salt), iterations: D.iterations, hash: "SHA-256" },
                                 base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}

async function show(key) {
  const page = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(D.iv) }, key, bytes(D.data));
  document.open();
  document.write(new TextDecoder().decode(page));
  document.close();
}

(async () => {
  const kept = localStorage.getItem(STORE);
  if (!kept) return;
  try {
    await show(await crypto.subtle.importKey("raw", bytes(kept), "AES-GCM", false, ["decrypt"]));
  } catch {
    localStorage.removeItem(STORE);
  }
})();

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = document.getElementById("e");
  message.textContent = "Opening…";
  const remember = document.getElementById("r").checked;
  try {
    const key = await keyFor(document.getElementById("p").value);
    const raw = await crypto.subtle.exportKey("raw", key);
    await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(D.iv) }, key, bytes(D.data));
    if (remember) localStorage.setItem(STORE, text(raw));
    await show(key);
  } catch {
    message.textContent = "That password doesn't open it.";
  }
});
